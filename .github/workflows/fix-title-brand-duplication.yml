name: Fix title brand duplication

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-title-brand-duplication.py"
      - ".github/workflows/fix-title-brand-duplication.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply title metadata cleanup
        run: python scripts/fix-title-brand-duplication.py

      - name: Verify removed child brand suffixes
        run: |
          ! grep -F 'title: `${page.title} | Mega Calculators`' 'app/[locale]/editorial-standards/page.tsx'
          ! grep -F 'title: `${page.title} | Mega Calculators`' 'app/[locale]/methodology/page.tsx'
          ! grep -F 'title: `${page.title} | Mega Calculators`' 'app/[locale]/corrections/page.tsx'
          ! grep -F 'title: `${localized.name} Embed | Mega Calculators`' 'app/[locale]/calculators/[category]/[slug]/embed/page.tsx'
          ! grep -F '`${seo.title} | Mega Calculators`' 'app/[locale]/calculators/[category]/[slug]/formula/page.tsx'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'app/[locale]/calculators/[category]/[slug]/page.tsx' \
            'app/[locale]/calculators/[category]/[slug]/formula/page.tsx' \
            'app/[locale]/calculators/[category]/[slug]/embed/page.tsx' \
            'app/[locale]/editorial-standards/page.tsx' \
            'app/[locale]/methodology/page.tsx' \
            'app/[locale]/corrections/page.tsx'
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
            exit 0
          fi
          git commit -m "fix: prevent duplicate brand names in titles"
          git push origin HEAD:main
