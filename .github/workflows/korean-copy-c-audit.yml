name: Korean Naturalization C

on:
  push:
    branches: [main]
    paths:
      - scripts/korean_naturalization_c.py
      - .github/workflows/korean-copy-c-audit.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply Korean naturalization C
        run: python scripts/korean_naturalization_c.py

      - name: Assert C cleanup
        run: |
          if grep -R -n --include='*.ts' --include='*.tsx' -E '실전 활용|활용 가이드|스펙 시트|계획 수립|보조 결과값|기본값과 가정값 처리|한국어 수학 계산기' app components lib; then exit 1; fi
          grep -q '결과를 더 잘 이해하려면' components/calculators/CalculatorEngine.tsx
          grep -q '이럴 때 유용해요' components/calculators/CalculatorSeoContent.tsx
          grep -q '제품 사양표' app/'[locale]'/calculators/'[category]'/'[slug]'/use-cases/page.tsx
          grep -q '같이 보면 좋은 글과 가이드' lib/calculators/seoContent.ts

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit C cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'[locale]'/calculators/'[category]'/'[slug]'/formula/page.tsx \
                  app/'[locale]'/calculators/'[category]'/'[slug]'/guide/page.tsx \
                  app/'[locale]'/calculators/'[category]'/'[slug]'/use-cases/page.tsx \
                  app/'[locale]'/contact/page.tsx \
                  app/'[locale]'/faq/page.tsx \
                  app/'[locale]'/privacy/page.tsx \
                  app/'[locale]'/terms/page.tsx \
                  app/'[locale]'/about/page.tsx \
                  components/calculators/CalculatorSeoContent.tsx \
                  components/calculators/CalculatorEngine.tsx \
                  lib/trustPages.ts \
                  lib/calculators/enhancedContent.ts \
                  lib/calculators/localization.ts \
                  lib/calculators/scenarioInterpretation.ts \
                  lib/calculators/seoContent.ts
          git commit -m "ux: polish Korean interface tone"
          git push
