name: Phase 1 currency and country verification
on:
  push:
    branches:
      - audit/phase1-currency-country-20261022
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:content:batch
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
