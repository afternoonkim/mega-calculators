name: Phase 1 User Perspective

on:
  push:
    branches: [main]
    paths:
      - scripts/phase1_user_perspective_cleanup.py
      - .github/workflows/phase1-user-perspective.yml

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply user-perspective cleanup
        run: python scripts/phase1_user_perspective_cleanup.py

      - name: Assert internal-facing copy is gone
        run: |
          ! grep -R "answer search queries" app components
          ! grep -R "long-tail question" app components
          ! grep -R "예시 페이지" app/'[locale]'/calculators/'[category]'/'[slug]'/formula/page.tsx
          ! grep -R "관련 페이지 이동" app/'[locale]'/calculators/'[category]'/'[slug]'/examples/'[example]'/page.tsx
          ! grep -R "More tools for this calculator" components/calculators/CalculatorEngine.tsx

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit phase 1 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'[locale]'/calculators/'[category]'/'[slug]'/formula/page.tsx \
                  app/'[locale]'/calculators/'[category]'/'[slug]'/guide/page.tsx \
                  app/'[locale]'/calculators/'[category]'/'[slug]'/use-cases/page.tsx \
                  app/'[locale]'/calculators/'[category]'/'[slug]'/examples/'[example]'/page.tsx \
                  components/calculators/CalculatorEngine.tsx
          git commit -m "ux: rewrite calculator support copy for users"
          git push
