name: Phase 2 Embed Disclosure

on:
  push:
    branches: [main]
    paths:
      - scripts/phase2_embed_disclosure.py
      - .github/workflows/phase2-embed-disclosure.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply phase 2 cleanup
        run: python scripts/phase2_embed_disclosure.py

      - name: Assert embed UI is secondary
        run: |
          grep -q '<details className="group' components/calculators/CalculatorEngine.tsx
          grep -q '웹사이트에 이 계산기 추가' components/calculators/CalculatorEngine.tsx
          grep -q 'Add this calculator to a website' components/calculators/CalculatorEngine.tsx
          if grep -q '>Embed this calculator<' components/calculators/CalculatorEngine.tsx; then exit 1; fi
          if grep -q '이 계산기 공유하기' components/calculators/CalculatorEngine.tsx; then exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit phase 2 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/calculators/CalculatorEngine.tsx
          git commit -m "ux: make calculator embed an optional action"
          git push
