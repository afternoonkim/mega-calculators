name: Phase 3 Calculator Tests

on:
  push:
    branches: [main]
    paths:
      - package.json
      - vitest.config.ts
      - lib/calculators/engine.test.ts
      - lib/calculators/engine.ts

permissions:
  contents: write

concurrency:
  group: phase3-calculator-tests
  cancel-in-progress: true

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for calculator tests"
          git push
