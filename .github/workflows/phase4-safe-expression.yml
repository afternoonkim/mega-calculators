name: Phase 4 Safe Expression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-safe-expression.yml
      - lib/calculators/expression.ts
      - lib/calculators/expression.test.ts

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Replace dynamic expression execution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/calculators/engine.ts")
          source = path.read_text()

          import_anchor = 'import { localizeResultText } from "@/lib/calculators/localization";\n'
          new_import = import_anchor + 'import { evaluateNumericExpression } from "@/lib/calculators/expression";\n'
          if new_import not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit("Could not identify localization import anchor")
              source = source.replace(import_anchor, new_import, 1)

          old_function = '''function safeEvalExpression(expr: string, values: Values) {
            const keys = Object.keys(values);
            const vars = keys.map((key) => num(values[key]));
            const fn = new Function(...keys, `return ${expr};`);
            const result = fn(...vars);
            return Number.isFinite(result) ? Number(result) : 0;
          }

          '''
          if old_function in source:
              source = source.replace(old_function, "", 1)
          elif "function safeEvalExpression" in source or "new Function" in source:
              raise SystemExit("Dynamic evaluator shape changed; refusing unsafe partial patch")

          old_call = 'const result = safeEvalExpression(definition.expr || "0", values);'
          new_call = 'const result = evaluateNumericExpression(definition.expr || "0", values);'
          if old_call in source:
              source = source.replace(old_call, new_call, 1)
          elif new_call not in source:
              raise SystemExit("Could not identify expression evaluator call")

          path.write_text(source)
          PY

      - name: Assert dynamic code execution is gone
        run: |
          if grep -R --line-number --fixed-strings "new Function" app components lib; then
            echo "Dynamic Function constructor remains in runtime source"
            exit 1
          fi
          if grep -R --line-number --fixed-strings "eval(" app components lib; then
            echo "eval() remains in runtime source"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit engine migration
        run: |
          if git diff --quiet -- lib/calculators/engine.ts; then
            echo "engine.ts already migrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/calculators/engine.ts
          git commit -m "refactor: remove dynamic expression execution"
          git push
