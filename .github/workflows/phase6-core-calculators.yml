name: Phase 6 Core Calculators

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase6-core-calculators.yml
      - scripts/phase6_core_calculators.py
      - scripts/phase6_fix_inputs.py
      - scripts/phase6_fix_expected.py

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch migration helper
        run: python scripts/phase6_fix_inputs.py

      - name: Patch mortgage test rounding
        run: python scripts/phase6_fix_expected.py

      - name: Apply core calculator upgrades
        run: python scripts/phase6_core_calculators.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit phase 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/calculators/data.ts lib/calculators/additional.ts lib/calculators/engine.ts lib/calculators/engine.test.ts
          if git diff --cached --quiet; then
            echo "Phase 6 already applied"
            exit 0
          fi
          git commit -m "feat: improve mortgage and paycheck calculators"
          git push
