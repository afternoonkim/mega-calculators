name: Phase 6 core calculator upgrade

on:
  push:
    branches: [main]
    paths:
      - "scripts/phase6-core-calculators.py"
      - ".github/workflows/phase6-core-calculators.yml"

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply phase 6 source changes
        run: python scripts/phase6-core-calculators.py

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Content audit
        run: npm run audit:content:batch

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit phase 6 atomically
        run: |
          rm scripts/phase6-core-calculators.py .github/workflows/phase6-core-calculators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/calculators/engine.ts lib/calculators/data.ts lib/calculators/additional.ts lib/calculators/engine.test.ts lib/calculators/localization.ts scripts/phase6-core-calculators.py .github/workflows/phase6-core-calculators.yml
          git commit -m "feat: complete core mortgage and paycheck upgrades"
          git push origin HEAD:main
