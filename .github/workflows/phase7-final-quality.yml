name: Phase 7 Final Quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase7-final-quality.yml
      - scripts/phase7_quality_finish.py

permissions:
  contents: write

jobs:
  finish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Apply final quality fixes
        run: python scripts/phase7_quality_finish.py

      - name: Use ESM Vitest config
        run: |
          if [ -f vitest.config.ts ]; then mv vitest.config.ts vitest.config.mts; fi

      - name: Apply compatible security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit phase 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css components/calculators/CalculatorEngine.tsx lib/calculators/engine.ts lib/calculators/engine.test.ts lib/calculators/validation.ts lib/calculators/validation.test.ts package-lock.json vitest.config.ts vitest.config.mts
          if git diff --cached --quiet; then
            echo "Phase 7 already applied"
            exit 0
          fi
          git commit -m "fix: harden calculator validation and accessibility"
          git push
