name: Setup content audit gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-content.mjs"
      - "package.json"
      - ".github/workflows/setup-content-audit.yml"

permissions:
  contents: write

jobs:
  setup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Fix array start parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/audit-content.mjs")
          text = path.read_text(encoding="utf-8")
          old = '    const arrayStart = source.indexOf("[", match.index);'
          new = '    const arrayStart = match.index + match[0].lastIndexOf("[");'
          if old not in text:
              raise SystemExit("Expected parser line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Create reviewed legacy baseline
        run: npm run audit:content:baseline

      - name: Install dependencies
        run: npm ci

      - name: Content audit
        run: npm run audit:content:batch

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit content audit gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-content.mjs scripts/content-audit-baseline.json
          if git diff --cached --quiet; then
            echo "No content audit changes to commit"
            exit 0
          fi
          git commit -m "chore: finalize baseline-aware content audit"
          git push origin HEAD:main
